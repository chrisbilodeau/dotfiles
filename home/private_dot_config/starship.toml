## NerdFont Icons ##
#  nf-oct-git_branch
#  nf-oct-git_compare
#  nf-cod-watch
# 󰧞 nf-md-circle_medium
# 󰚑 nf-md-bomb
#  nf-fa-stop_circle_o
#  nf-fa-play_circle_o
# 󰯉 nf-md-space_invaders
#  nf-weather-fire
#  nf-ple-left_half_circle_thick
#  nf-ple-right_half_circle_thick
#  nf-oct-rocket
#  nf-cod-home
#  nf-weather-fire
#  nf-seti-go
# 󰌠 nf-md-language_python
# 󱘗 nf-md-language_rust

palette = "catppuccin_macchiato"
add_newline = true
format="""
$all\
$fill\
$git_branch\
$git_status\
$golang\
$python\
$rust\
$time\
$cmd_duration
$character
"""

## Disabled Modules ##
# Needs to be above other tables for this TOML format to work
package.disabled = true


## Module Configs ##

[character]
success_symbol = "[](mauve)"
error_symbol = "[](red)"

[directory]
home_symbol = ""

[line_break]
disabled = true

# Times
[time]
disabled = false
format = """
[](bg:none fg:surface1)\
[ $time ](bg:surface1 fg:subtext1 bold)\
[](bg:surface1 fg:sky)\
[  ](bg:sky fg:mantle)\
[](bg:none fg:sky)\
"""

[cmd_duration]
format = """
[](bg:none fg:surface1)\
[ $duration ](bg:surface1 fg:subtext1 bold)\
[](bg:surface1 fg:yellow)\
[  ](bg:yellow fg:black)\
[](bg:none fg:yellow)\
"""

# Git
[git_branch]
format = """
[](bg:none fg:surface1)\
[ $branch ](bg:surface1 fg:subtext1 bold)\
[](bg:surface1 fg:flamingo)\
[  ](bg:flamingo fg:mantle)\
[](bg:none fg:flamingo)\
"""

[git_status]
format = """
[](bg:none fg:surface1)\
[ $all_status$ahead_behind ](bg:surface1 fg:subtext1 bold)\
[](bg:surface1 fg:rosewater)\
[  ](bg:rosewater fg:mantle)\
[](bg:none fg:rosewater)\
"""
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Languages
[golang]
format = """
[](bg:none fg:surface1)\
[ $version (\\($virtualenv\\)) ](bg:surface1 fg:subtext1 bold)\
[](bg:surface1 fg:teal)\
[  ](bg:teal fg:mantle)\
[](bg:none fg:teal)\
"""

[python]
format = """
[](bg:none fg:surface1)\
[ $version (\\($virtualenv\\)) ](bg:surface1 fg:subtext1 bold)\
[](bg:surface1 fg:teal)\
[ 󰌠 ](bg:teal fg:mantle)\
[](bg:none fg:teal)\
"""

[rust]
format = """
[](bg:none fg:surface1)\
[ $version (\\($virtualenv\\)) ](bg:surface1 fg:subtext1 bold)\
[](bg:surface1 fg:teal)\
[ 󱘗 ](bg:teal fg:mantle)\
[](bg:none fg:teal)\
"""


[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
